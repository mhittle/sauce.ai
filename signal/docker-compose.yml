# Local dev stack: Postgres (PostGIS + pgvector) + the API.
# The db image adds pgvector on top of PostGIS (seed/docker-db/Dockerfile);
# `jobs/init_db.py` then applies seed/schema.sql (which CREATE EXTENSIONs).
services:
  db:
    build: ./seed/docker-db
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
      POSTGRES_DB: signal
    ports:
      - "5432:5432"
    volumes:
      - signal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://signal:signal@db:5432/signal
      SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN:-}
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  signal_pgdata:
