name: Unattended dev-agent dispatcher

# claude-code-action@v1 only runs on pull_request*/issues/issue_comment/
# repository_dispatch events — NOT push/schedule/workflow_dispatch. So the
# push picker and the manual trigger do their logic, then fan out one
# `repository_dispatch` (type: dev-implement) per assignment, and the
# implement job runs the agent under that supported event. The PAT is
# required: a repository_dispatch sent with the default GITHUB_TOKEN would
# not start a new workflow run.
on:
  push:
    branches: [main]
    paths:
      - roadmap.md
  workflow_dispatch:
    inputs:
      title:
        description: "Roadmap item title to dispatch (exact match). Used verbatim as the agent's assignment; not flipped in roadmap.md."
        required: true
        type: string
  repository_dispatch:
    types: [dev-implement]

concurrency:
  group: dev-agent-${{ github.event.client_payload.title || github.event.inputs.title || 'pick' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  pick:
    if: vars.AGENTS_ENABLED == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_PUSH_TOKEN }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pick ready-for-agent items
        id: picker
        run: python .github/scripts/pick_ready_items.py
      - name: Dispatch one implement run per item
        if: steps.picker.outputs.items != '[]'
        uses: actions/github-script@v7
        env:
          ITEMS: ${{ steps.picker.outputs.items }}
        with:
          github-token: ${{ secrets.AGENT_PUSH_TOKEN }}
          script: |
            const items = JSON.parse(process.env.ITEMS || '[]');
            for (const title of items) {
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'dev-implement',
                client_payload: { title },
              });
              core.info(`dispatched dev-implement: ${title}`);
            }

  manual:
    if: vars.AGENTS_ENABLED == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch implement run for the given title
        uses: actions/github-script@v7
        env:
          DISPATCH_TITLE: ${{ github.event.inputs.title }}
        with:
          github-token: ${{ secrets.AGENT_PUSH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'dev-implement',
              client_payload: { title: process.env.DISPATCH_TITLE },
            });
            core.info(`dispatched dev-implement: ${process.env.DISPATCH_TITLE}`);

  implement:
    if: vars.AGENTS_ENABLED == 'true' && github.event_name == 'repository_dispatch' && github.event.action == 'dev-implement'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_PUSH_TOKEN }}
          fetch-depth: 0
      - name: Compose prompt
        id: prompt
        env:
          ASSIGNMENT_TITLE: ${{ github.event.client_payload.title }}
        run: |
          python - <<'PY'
          import os, pathlib
          tpl = pathlib.Path(".github/agents/dev-warmup.md").read_text(encoding="utf-8")
          prompt = tpl.replace("{{ASSIGNMENT_TITLE}}", os.environ["ASSIGNMENT_TITLE"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("prompt<<__PROMPT_EOF__\n")
              fh.write(prompt)
              if not prompt.endswith("\n"):
                  fh.write("\n")
              fh.write("__PROMPT_EOF__\n")
          PY
      - name: Mark agent start
        run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AGENT_PUSH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: "--model claude-opus-4-7 --max-budget-usd 8 --permission-mode bypassPermissions"
      - name: Report agent run
        if: always()
        env:
          AGENT_OPS_SECRET: ${{ secrets.AGENT_OPS_SECRET }}
          SITE_URL: https://sauce.ai/news
          WORKFLOW: dev-agent
          JOB: implement
          RUN_ID: ${{ github.run_id }}
          CONCLUSION: ${{ job.status }}
          EST_COST_USD: "8"
          NOTES: "budget-cap"
        run: python .github/scripts/report_agent_run.py
