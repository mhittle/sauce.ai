name: Migration executor

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: migration-executor-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  SITE_URL: https://sauce.ai/news

jobs:
  apply:
    if: vars.AGENTS_ENABLED == 'true' && github.event.label.name == 'needs-migration'
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.find.outputs.files }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_PUSH_TOKEN }}
          fetch-depth: 0
      - name: Find migration files in the PR diff
        id: find
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" \
            -- 'news/seed/migrations/*.sql' || true)
          echo "Migration files in diff:"
          echo "$files"
          count=$(printf '%s\n' "$files" | grep -c . || true)
          {
            echo "count=$count"
            echo "files<<__EOF__"
            echo "$files"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
      - name: Apply migrations + restart
        if: steps.find.outputs.count != '0'
        env:
          AGENT_OPS_SECRET: ${{ secrets.AGENT_OPS_SECRET }}
        run: |
          set -euo pipefail
          sign() {  # $1=timestamp $2=body  -> hexdigest on stdout
            python - "$1" "$2" <<'PY'
          import hashlib, hmac, os, sys
          secret = os.environ["AGENT_OPS_SECRET"].encode()
          ts, body = sys.argv[1], sys.argv[2].encode()
          print(hmac.new(secret, ts.encode() + b"." + body, hashlib.sha256).hexdigest())
          PY
          }
          post() {  # $1=path $2=body
            ts=$(date +%s)
            sig=$(sign "$ts" "$2")
            resp=$(curl -sS -w $'\n%{http_code}' --max-time 120 \
              -X POST "${SITE_URL%/}$1" \
              -H "Content-Type: application/json" \
              -H "X-Agent-Timestamp: $ts" \
              -H "X-Agent-Signature: $sig" \
              --data "$2")
            code=$(printf '%s' "$resp" | tail -n1)
            payload=$(printf '%s' "$resp" | sed '$d')
            echo "POST $1 -> $code"
            echo "$payload"
            if [ "$code" != "200" ]; then
              echo "::error::POST $1 failed with $code"
              exit 1
            fi
            # run-migration / restart return {"status":"ok",...}; fail on anything else.
            if ! printf '%s' "$payload" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "::error::POST $1 returned non-ok status"
              exit 1
            fi
          }
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            name=$(basename "$f")
            echo "::group::Applying $name"
            post "/agent-ops/run-migration" "{\"filename\": \"$name\"}"
            echo "::endgroup::"
          done <<< "${{ steps.find.outputs.files }}"
          echo "::group::Restart app"
          post "/agent-ops/restart-app" "{}"
          echo "::endgroup::"

  finalize:
    needs: apply
    if: needs.apply.result == 'success' && needs.apply.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_PUSH_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Compose finalize prompt
        id: prompt
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MIGRATION_FILES: ${{ needs.apply.outputs.files }}
        run: |
          python - <<'PY'
          import os
          files = [os.path.basename(x) for x in os.environ["MIGRATION_FILES"].split("\n") if x.strip()]
          prompt = f"""You are an unattended Claude Haiku agent finalizing an applied
          database migration. The migration-executor workflow has ALREADY applied these
          migration files to the production database and restarted the app, successfully:

          {chr(10).join('  - ' + f for f in files)}

          Repo: {os.environ['REPO']}  PR: #{os.environ['PR_NUMBER']}

          Do exactly these four things, then stop. Budget is tight (Haiku, $0.50).

          1. In `manual-actions.md`, for EACH applied file above, find the matching
             entry in the Open section (match on the migration filename appearing in the
             entry's `**File reference:**` line or its inline SQL/title) and move that
             entry into the Completed section, newest-first, setting
             `**Status:** completed` and adding `**Completed:** <today UTC date>`.
             Preserve the entry's body verbatim otherwise. If no matching Open entry
             exists for a file, leave a one-line note in the PR comment (step 3) and
             do not invent one. Commit the change to the current branch (the PR head
             branch) with message "manual-actions: mark applied migration(s) completed
             [skip ci]" and push.
          2. (covered by the commit in step 1).
          3. Post a comment on PR #{os.environ['PR_NUMBER']}:
             `gh pr comment {os.environ['PR_NUMBER']} --repo {os.environ['REPO']} --body "..."`
             Body MUST be exactly: "✅ Migration applied, app restarted. Ready to merge."
             (append any per-file note from step 1 on following lines).
          4. Swap labels:
             `gh pr edit {os.environ['PR_NUMBER']} --repo {os.environ['REPO']} --remove-label needs-migration --add-label migration-applied`
             If `migration-applied` does not exist yet, create it once:
             `gh label create migration-applied --repo {os.environ['REPO']} --description "Migration applied to prod by the executor" --color 0E8A16 || true`

          Constraints: never touch app code or the migration files themselves; never push to main;
          only edit manual-actions.md. No emojis anywhere except the exact comment string in step 3.
          """
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("prompt<<__PROMPT_EOF__\n")
              fh.write(prompt)
              if not prompt.endswith("\n"):
                  fh.write("\n")
              fh.write("__PROMPT_EOF__\n")
          PY
      - name: Run finalize agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AGENT_PUSH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: "--model claude-haiku-4-5 --max-turns 20 --max-budget-usd 0.5"
