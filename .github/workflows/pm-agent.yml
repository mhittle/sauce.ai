name: PM agent

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pm-agent
  cancel-in-progress: false

env:
  SITE_URL: https://sauce.ai/news

jobs:
  propose:
    if: vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_PUSH_TOKEN }}
          fetch-depth: 0
      - name: Compose prompt
        id: prompt
        env:
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, pathlib, datetime
          tpl = pathlib.Path(".github/agents/pm-agent.md").read_text(encoding="utf-8")
          repl = {
              "SITE_URL": os.environ["SITE_URL"],
              "REPO": os.environ["REPO"],
              "TODAY": datetime.datetime.utcnow().strftime("%Y-%m-%d"),
          }
          for k, v in repl.items():
              tpl = tpl.replace("{{" + k + "}}", v)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("prompt<<__PROMPT_EOF__\n")
              fh.write(tpl)
              if not tpl.endswith("\n"):
                  fh.write("\n")
              fh.write("__PROMPT_EOF__\n")
          PY
      - name: Run PM agent
        uses: anthropics/claude-code-action@v1
        env:
          SMOKE_TEST_USER: ${{ secrets.SMOKE_TEST_USER }}
          SMOKE_TEST_PASS: ${{ secrets.SMOKE_TEST_PASS }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AGENT_PUSH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: "--model claude-opus-4-7 --max-budget-usd 4 --permission-mode bypassPermissions"
