name: PM agent

# claude-code-action@v1 does not run on schedule/workflow_dispatch events.
# The scheduled/manual trigger fires a `repository_dispatch` (type:
# pm-propose) via the PAT; the propose job runs the agent under that
# supported event.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [pm-propose]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pm-agent
  cancel-in-progress: false

env:
  SITE_URL: https://sauce.ai/news

jobs:
  trigger:
    if: vars.AGENTS_ENABLED == 'true' && github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Fire pm-propose repository_dispatch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AGENT_PUSH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'pm-propose',
              client_payload: {},
            });
            core.info('dispatched pm-propose');

  propose:
    if: vars.AGENTS_ENABLED == 'true' && github.event_name == 'repository_dispatch' && github.event.action == 'pm-propose'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_PUSH_TOKEN }}
          fetch-depth: 0
      - name: Compose prompt
        id: prompt
        env:
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, pathlib, datetime
          tpl = pathlib.Path(".github/agents/pm-agent.md").read_text(encoding="utf-8")
          repl = {
              "SITE_URL": os.environ["SITE_URL"],
              "REPO": os.environ["REPO"],
              "TODAY": datetime.datetime.utcnow().strftime("%Y-%m-%d"),
          }
          for k, v in repl.items():
              tpl = tpl.replace("{{" + k + "}}", v)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("prompt<<__PROMPT_EOF__\n")
              fh.write(tpl)
              if not tpl.endswith("\n"):
                  fh.write("\n")
              fh.write("__PROMPT_EOF__\n")
          PY
      - name: Mark agent start
        run: echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Run PM agent
        uses: anthropics/claude-code-action@v1
        env:
          SMOKE_TEST_USER: ${{ secrets.SMOKE_TEST_USER }}
          SMOKE_TEST_PASS: ${{ secrets.SMOKE_TEST_PASS }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AGENT_PUSH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: "--model claude-opus-4-7 --max-budget-usd 4 --permission-mode bypassPermissions"
      - name: Report agent run
        if: always()
        env:
          AGENT_OPS_SECRET: ${{ secrets.AGENT_OPS_SECRET }}
          SITE_URL: https://sauce.ai/news
          WORKFLOW: pm-agent
          JOB: propose
          RUN_ID: ${{ github.run_id }}
          CONCLUSION: ${{ job.status }}
          EST_COST_USD: "4"
          NOTES: "budget-cap"
        run: python .github/scripts/report_agent_run.py
