<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="csrf-token" content="{{ csrf_token }}" />
  <title>{% block title %}News{% endblock %}</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <script src="{{ url_for('static', filename='htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', filename='alpine.min.js') }}" defer></script>
</head>
<body>
<nav class="topnav">
  <a class="brand" href="{{ url_for('feed.index') }}">sauce.ai<span class="brand-slash">/</span><em>news</em></a>
  <a href="{{ url_for('feed.index') }}">Feed</a>
  <a href="{{ url_for('trending.index') }}">Trending</a>
  <a href="{{ url_for('firehose.index') }}">Firehose</a>
  <form class="nav-search" method="get" action="{{ url_for('search.index') }}" role="search">
    <input type="search" name="q" value="{{ request.args.get('q', '') }}"
           placeholder="Search&hellip;" aria-label="Search articles" />
  </form>
  {% if current_user %}
    <a href="{{ url_for('algo.index') }}">Your Algo</a>
    <a href="{{ url_for('sources.index') }}">Your Sources</a>
    <a href="{{ url_for('saves.saved') }}">Saved</a>
    <a href="{{ url_for('account.settings') }}">Settings</a>
    {% if current_user.is_admin %}<a href="{{ url_for('admin.index') }}">Admin</a>{% endif %}
    <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
      {{ csrf_field() }}
      <button type="submit" class="linkbtn">Sign out ({{ current_user.email }})</button>
    </form>
  {% else %}
    <a href="{{ url_for('auth.login') }}">Sign in</a>
    <a href="{{ url_for('auth.signup') }}">Sign up</a>
  {% endif %}
  <button type="button" id="theme-toggle" class="linkbtn theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">Dark</button>
</nav>
<main>
{% block content %}{% endblock %}
</main>
<script>
  window.csrfToken = document.querySelector('meta[name="csrf-token"]').content;
  document.body.addEventListener('htmx:configRequest', function (e) {
    e.detail.headers['X-CSRF-Token'] = window.csrfToken;
  });
  (function () {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    function sync() {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      btn.textContent = dark ? 'Light' : 'Dark';
      btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
    }
    sync();
    btn.addEventListener('click', function () {
      var dark = document.documentElement.getAttribute('data-theme') === 'dark';
      var next = dark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      sync();
    });
  })();
</script>
</body>
</html>
