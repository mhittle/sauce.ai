<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#fafaf7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;color:#1a1a1a;line-height:1.45;">
  <div style="max-width:640px;margin:0 auto;padding:24px 20px;">

    <p style="margin:0 0 12px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#b04a3a;font-weight:600;">Breaking</p>

    <h1 style="margin:0 0 12px;font-family:ui-serif,'Iowan Old Style','Charter','Source Serif Pro',Georgia,serif;font-weight:600;font-size:24px;line-height:1.25;">
      <a href="{{ story_url }}" style="color:#1a1a1a;text-decoration:none;">{{ headline }}</a>
    </h1>

    {% if blurb %}
      <p style="margin:0 0 18px;color:#3a3a3a;font-size:15px;">{{ blurb }}</p>
    {% endif %}

    <p style="margin:0 0 18px;color:#6a6a6a;font-size:13px;">
      {{ outlet_count }} outlets are covering this story. <a href="{{ story_url }}" style="color:#1f6feb;">Read across the spectrum &rarr;</a>
    </p>

    <div style="border-top:1px solid #e3e3df;margin-top:24px;padding-top:16px;color:#6a6a6a;font-size:12px;">
      <p style="margin:0 0 6px;">More at <a href="{{ site_url }}/" style="color:#1f6feb;">sauce.ai/news</a>.</p>
      <p style="margin:0;">Don't want breaking alerts? <a href="{{ unsubscribe_url }}" style="color:#1f6feb;">Unsubscribe</a> or change them in <a href="{{ site_url }}/account/settings" style="color:#1f6feb;">your settings</a>. (The daily digest is a separate setting.)</p>
    </div>

  </div>
</body>
</html>
